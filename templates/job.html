
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Status - DigiSkills</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f5f9; margin: 0; padding: 24px; color: #172033; }
    main { max-width: 800px; margin: 25px auto; background: white; padding: 25px; border-radius: 14px; box-shadow: 0 4px 20px #0001; }
    h1 { color: #2457c5; }
    .panel { background: #eef3ff; padding: 14px; border-radius: 8px; margin: 14px 0; }
    .bar { height: 14px; background: #e2e6ee; border-radius: 10px; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: #2457c5; transition: width .3s; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #111827; color: #e5e7eb; padding: 14px; border-radius: 8px; max-height: 350px; overflow: auto; }
    a, button { color: #2457c5; }
    .button { display: inline-block; background: #2457c5; color: white; padding: 11px 16px; border-radius: 7px; text-decoration: none; margin: 8px 8px 8px 0; }
  </style>
</head>
<body>
<main>
  <h1>DigiSkills Download Status</h1>
  <div class="panel">
    <p><strong>Status:</strong> <span id="status">Loading...</span></p>
    <p id="message">Please wait...</p>
    <div class="bar"><div id="fill"></div></div>
    <p id="count">0 / 0 videos</p>
    <p id="result"></p>
  </div>

  <div id="links"></div>
  <h3>Activity log</h3>
  <pre id="logs">Waiting for updates...</pre>
  <p><a href="/">← Back to downloader</a></p>
</main>

<script>
const jobId = {{ job_id | tojson }};
async function refreshJob() {
  try {
    const response = await fetch("/api/job/" + encodeURIComponent(jobId));
    const job = await response.json();
    if (!response.ok) throw new Error(job.error || "Could not load job");

    document.getElementById("status").textContent = job.status || "unknown";
    document.getElementById("message").textContent = job.message || "";
    const total = Number(job.total || 0);
    const current = Number(job.current || 0);
    const percent = total ? Math.min(100, Math.round(current / total * 100)) : 0;
    document.getElementById("fill").style.width = percent + "%";
    document.getElementById("count").textContent = current + " / " + total + " videos";
    document.getElementById("result").textContent =
      "Successful: " + (job.success || 0) + " | Failed: " + (job.failed || 0);
    document.getElementById("logs").textContent =
      (job.logs || []).join("\n") || "No log entries yet.";

    const links = document.getElementById("links");
    links.innerHTML = "";
    if (job.status === "done") {
      if (job.zip_ready) {
        const a = document.createElement("a");
        a.className = "button";
        a.href = "/download/" + encodeURIComponent(jobId);
        a.textContent = "Download ZIP";
        links.appendChild(a);
      }
      const report = document.createElement("a");
      report.className = "button";
      report.href = "/report/" + encodeURIComponent(jobId);
      report.textContent = "Download CSV Report";
      links.appendChild(report);
    }
    if (job.status === "running" || job.status === "queued") {
      setTimeout(refreshJob, 3000);
    }
  } catch (error) {
    document.getElementById("status").textContent = "Update error";
    document.getElementById("message").textContent = error.message;
    setTimeout(refreshJob, 5000);
  }
}
refreshJob();
</script>
</body>
</html>
