
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigiSkills Video Downloader</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f5f9; margin:0; padding:24px; color:#172033; }
    main { max-width:760px; margin:30px auto; background:white; padding:28px; border-radius:14px; box-shadow:0 4px 20px #0001; }
    h1 { color:#2457c5; margin-top:0; }
    label { display:block; margin:18px 0 8px; font-weight:bold; }
    textarea, select, input { box-sizing:border-box; width:100%; padding:12px; border:1px solid #ccd3df; border-radius:7px; font-size:15px; }
    textarea { min-height:160px; }
    button { margin-top:20px; background:#2457c5; color:white; border:0; padding:13px 20px; border-radius:7px; cursor:pointer; font-size:16px; }
    .note { background:#fff4d8; padding:12px; border-radius:7px; line-height:1.5; }
  </style>
</head>
<body>
<main>
  <h1>DigiSkills Video Downloader</h1>
  <p>Paste video URLs below, or upload a CSV file containing YouTube links.</p>
  <p class="note">Use only videos you are authorized to download. Large downloads may exceed the hosting service's limits.</p>

  <form action="/start" method="post" enctype="multipart/form-data">
    <label for="urls">YouTube URLs (one per line)</label>
    <textarea id="urls" name="urls" placeholder="https://www.youtube.com/watch?v=..."></textarea>

    <label for="csv_file">Or upload CSV file</label>
    <input id="csv_file" name="csv_file" type="file" accept=".csv">

    <label for="quality">Video quality</label>
    <select id="quality" name="quality">
      <option value="1080">1080p (H.264 preferred)</option>
      <option value="720">720p</option>
      <option value="best">Best available</option>
    </select>

    <label for="max_urls">Maximum videos</label>
    <select id="max_urls" name="max_urls">
      <option value="5">5 videos</option>
      <option value="10">10 videos</option>
      <option value="20">20 videos</option>
      <option value="30">30 videos</option>
    </select>

    <button type="submit">Start Download</button>
  </form>
</main>
</body>
</html>
